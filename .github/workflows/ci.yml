name: CI

on:
  push:
    branches: [main, "foundation/**", "runtime/**", "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  native-linux:
    name: Native core · Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure

  native-windows:
    name: Native core · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure, build and test in MSVC environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found" }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw "Visual Studio C++ toolchain was not found" }
          $devCmd = Join-Path $install "Common7\Tools\VsDevCmd.bat"
          $command = "call `"$devCmd`" -arch=x64 && ninja --version && cmake --preset dev && cmake --build --preset dev && ctest --preset dev --output-on-failure"
          & $env:ComSpec /D /S /C $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  studio:
    name: Studio contracts and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Bridge and Director checks
        run: pnpm bridge:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build:web
